openapi: 3.1.0
info:
  title: iso3166-updates API
  version: "1.8.8"
  description: |
    REST API for the latest and historic ISO 3166 updates/changes, as published by the ISO.
    Each update object has a Change, Description of Change, Date Issued and Source attribute.
    Base URL serves the docs; all routes below are relative to /api and are also available
    without the /api prefix.
servers:
  - url: https://iso3166-updates.vercel.app/api
tags:
  - name: Updates
  - name: Search
  - name: Utility
components:
  parameters:
    Fields:
      name: fields
      in: query
      description: Comma-separated list of update attributes to include (e.g. `Change,Date Issued`).
      required: false
      schema: { type: string }
    SortBy:
      name: sortBy
      in: query
      description: |
        Sort the output by publication date. `dateAsc` or `dateDesc`, any other value leaves the
        output sorted by country code. Sorted output is a flat list rather than a country map,
        with a `Country Code` attribute added to each update.
      required: false
      schema:
        type: string
        enum: [dateAsc, dateDesc]
    Likeness:
      name: likeness
      in: query
      description: |
        Similarity threshold (0–100). Higher returns fewer, more exact matches.
        Applies to `/search/{input}` and `/country_name/{input}`.
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 100
    ExcludeMatchScore:
      name: excludeMatchScore
      in: query
      description: Exclude the `Match Score` attribute from `/search` results when truthy.
      required: false
      schema:
        oneOf:
          - type: boolean
          - type: integer
    Limit:
      name: limit
      in: query
      description: |
        Maximum number of results to return, applied per country for the country keyed
        responses and per update record for the flat list responses. 0 means no limit.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Offset:
      name: offset
      in: query
      description: Number of results to skip before applying `limit`.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Format:
      name: format
      in: query
      description: Set to `csv` to return the updates as CSV rather than the JSON envelope.
      required: false
      schema:
        type: string
        enum: [json, csv]
        default: json
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        path: { type: string }
        status: { type: integer }
      required: [message, path, status]
    Update:
      type: object
      properties:
        Change:
          type: string
          example: "Subdivisions added: 7 parishes."
        Description of Change:
          type: string
          example: "Addition of the administrative subdivisions and of their code elements."
        Date Issued:
          type: string
          description: Publication date, with a corrected date appended in parenthesis if the update was corrected.
          example: "2011-12-13 (corrected 2011-12-15)"
        Source:
          type: string
          example: "Newsletter I-2 - https://www.iso.org/iso-3166-country-codes.html"
        Country Code:
          type: string
          description: Only present on the flat list responses (sortBy, /search, /latest).
          example: "AD"
        Match Score:
          type: integer
          description: Only present on /search results, unless excluded via excludeMatchScore.
          minimum: 0
          maximum: 100
          example: 100
    Metadata:
      type: object
      properties:
        count: { type: integer, example: 12 }
        generated: { type: string, format: date-time, example: "2026-07-23T13:45:02Z" }
        total: { type: integer, description: Total records before pagination, present when limit/offset are used. }
        offset: { type: integer }
        limit: { type: [integer, "null"] }
      required: [count, generated]
    UpdatesResponse:
      type: object
      description: Country keyed updates envelope.
      properties:
        data:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/Update" }
        metadata: { $ref: "#/components/schemas/Metadata" }
      required: [data, metadata]
    UpdatesListResponse:
      type: object
      description: Flat list updates envelope, returned when the output is sorted by date or from /search and /latest.
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Update" }
        metadata: { $ref: "#/components/schemas/Metadata" }
      required: [data, metadata]
  responses:
    Updates:
      description: ISO 3166 updates envelope
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/UpdatesResponse"
              - $ref: "#/components/schemas/UpdatesListResponse"
        text/csv:
          schema: { type: string }
    BadRequest:
      description: Invalid parameter input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /all:
    get:
      tags: [Updates]
      summary: Get all updates for all countries
      parameters:
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /alpha/{input}:
    get:
      tags: [Updates]
      summary: Get updates by ISO 3166-1 code(s)
      description: Accepts alpha-2, alpha-3 or numeric country codes, comma-separated (e.g. `FR,DEU,276`).
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
          example: "FR,DEU,276"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /year/{input}:
    get:
      tags: [Updates]
      summary: Get updates by year
      description: |
        Accepts a single year, a comma-separated list of years, a year range (`2010-2015`), a year
        prefixed with `>` or `<` (updates greater than/less than that year) or `<>` (excluding those
        years). The `?exclude=YEAR` query string parameter is a URL-safe alternative to `<>`.
        Years must be >= 1996.
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
          example: "2010-2015"
        - name: exclude
          in: query
          description: Year/years to exclude, equivalent to the `<>` path syntax.
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /alpha/{input}/year/{year}:
    get:
      tags: [Updates]
      summary: Get updates by country code(s) and year
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
          example: "FR"
        - name: year
          in: path
          required: true
          schema: { type: string }
          example: "2015-2020"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /country_name/{input}:
    get:
      tags: [Updates]
      summary: Get updates by country name(s)
      description: Accepts one or more country names in English, comma-separated. Fuzzy matching controlled by `likeness`.
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
          example: "Tajikistan,Seychelles,Uganda"
        - $ref: "#/components/parameters/Likeness"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /country_name/{input}/year/{year}:
    get:
      tags: [Updates]
      summary: Get updates by country name(s) and year
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
          example: "Ireland"
        - name: year
          in: path
          required: true
          schema: { type: string }
          example: "2015"
        - $ref: "#/components/parameters/Likeness"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /date_range/{input}:
    get:
      tags: [Updates]
      summary: Get updates published within a date range
      description: |
        One or two comma-separated dates in the format YYYY-MM-DD. A single date acts as the start
        date, with today as the end date. An update is included if either its publication date or
        its corrected date falls within the range.
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
          example: "2011-12-13,2011-12-16"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /date_range/{input}/alpha/{alpha}:
    get:
      tags: [Updates]
      summary: Get updates within a date range for specific country code(s)
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string }
          example: "2011-12-13,2011-12-16"
        - name: alpha
          in: path
          required: true
          schema: { type: string }
          example: "AF"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /search/{input}:
    get:
      tags: [Search]
      summary: Search updates by keyword(s)
      description: |
        Fuzzy search over the Change and Description of Change attributes, sorted by match score.
        Search terms are limited to 200 characters.
      parameters:
        - name: input
          in: path
          required: true
          schema: { type: string, maxLength: 200 }
          example: "Paris"
        - $ref: "#/components/parameters/Likeness"
        - $ref: "#/components/parameters/ExcludeMatchScore"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /latest:
    get:
      tags: [Updates]
      summary: Get the most recently published updates across all countries
      parameters:
        - name: n
          in: query
          description: Number of most recent updates to return.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { $ref: "#/components/responses/Updates" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /version:
    get:
      tags: [Utility]
      summary: Get the version of the iso3166-updates software used by the API
      responses:
        "200":
          description: Version string
          content:
            text/plain:
              schema: { type: string }
              example: "1.8.8"
  /spec:
    get:
      tags: [Utility]
      summary: Get this OpenAPI specification
      responses:
        "200":
          description: OpenAPI specification
          content:
            text/yaml:
              schema: { type: string }
